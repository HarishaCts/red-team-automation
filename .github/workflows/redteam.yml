name: Red-Team CI

# Runs the framework's own test suite on every push/PR, and — on merges to main
# — executes a red-team campaign against the configured target as a regression
# gate. The campaign step fails the build if any CRITICAL breach is detected.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # allow manual runs

jobs:
  test:
    name: Unit tests (mock backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check redteam api tests
      - name: Test
        run: pytest -q

  redteam-scan:
    name: Red-team regression scan
    runs-on: ubuntu-latest
    needs: test
    # Only run the (potentially API-billed) live scan on main.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run campaign
        env:
          # If this secret is unset, the framework runs in mock mode and the
          # scan still completes (useful for forks without secrets access).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: redteam run --config config/config.example.yaml
      - name: Enforce zero critical breaches
        run: |
          python - <<'PY'
          import glob, json, sys
          reports = sorted(glob.glob("reports/report_*.json"))
          if not reports:
              print("No report produced"); sys.exit(1)
          data = json.load(open(reports[-1]))
          crit = data["executive_summary"]["critical_breaches"]
          print(f"Critical breaches: {crit}")
          sys.exit(1 if crit > 0 else 0)
          PY
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report
          path: reports/